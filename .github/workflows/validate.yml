name: Validate Cinemax
on:
  push:
    branches: [master, cinemax-improvements]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore Cinemax.sln
      - run: dotnet build Cinemax.sln --configuration Release --no-restore
      - run: dotnet test Cinemax.sln --configuration Release --no-build
